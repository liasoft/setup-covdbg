name: 'Setup covdbg'
description: 'Download and setup covdbg on Windows runners'
author: 'covdbg'
branding:
  icon: 'download'
  color: 'blue'
inputs:
  version:
    description: 'Version of covdbg to download (e.g., 1.4.0, latest)'
    required: true
  architecture:
    description: 'Architecture of covdbg to download (x64 or arm64). Defaults to the runner architecture.'
    required: false
outputs:
  covdbg-path:
    description: 'Path where covdbg was installed'
runs:
  using: 'node24'
  main: 'dist/index.js'
